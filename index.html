<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mridula ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff6fa5,#ffc7de,#ffeaf3);
}
.card{
width:90%;
max-width:360px;
padding:28px;
border-radius:28px;
text-align:center;
background:rgba(255,255,255,.18);
backdrop-filter:blur(16px);
box-shadow:0 20px 40px rgba(0,0,0,.18);
color:#fff;
}
.cake{font-size:78px;animation:bounce 2s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
h1{font-size:32px}
.name{
font-size:30px;
font-weight:bold;
color:#fff;
text-shadow:0 0 18px #fff;
animation:glow 2s infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 10px #fff}
to{text-shadow:0 0 28px #ff2f7d}
}
#countdown{margin:18px 0;font-size:18px}
button{
border:none;
padding:14px 24px;
border-radius:999px;
background:#fff;
color:#ff2f7d;
font-weight:700;
font-size:16px;
}
.heart,.sparkle{
position:absolute;
pointer-events:none;
animation:float linear infinite;
}
@keyframes float{
0%{transform:translateY(100vh) rotate(0)}
100%{transform:translateY(-120px) rotate(360deg)}
}
.popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
justify-content:center;
align-items:center;
}
.box{
width:86%;
max-width:340px;
background:white;
color:#ff2f7d;
padding:24px;
border-radius:24px;
text-align:center;
}
</style>
</head>
<body>

<div class="card">
<div class="cake">🎂</div>
<h1>Happy Birthday</h1>
<div class="name">Mridula ✨</div>
<p>8 October 💖</p>
<div id="countdown"></div>
<button onclick="openLetter()">Open Love Letter 💌</button>
</div>

<div class="popup" id="popup">
<div class="box">
<h2>To Mridula 🌸</h2>
<p style="margin:16px 0">
Happy Birthday! ❤️
May your smile always stay bright, your dreams come true, and every day bring you happiness.
</p>
<button onclick="closeLetter()">Close</button>
</div>
</div>

<script>
const year=new Date().getFullYear();
const target=new Date(year,9,8);

function update(){
const now=new Date();
let diff=target-now;
if(diff<0){
document.getElementById("countdown").innerHTML="🎉 Today is your day!";
return;
}
let d=Math.floor(diff/86400000);
let h=Math.floor(diff%86400000/3600000);
let m=Math.floor(diff%3600000/60000);
let s=Math.floor(diff%60000/1000);
document.getElementById("countdown").innerHTML=
`⏳ ${d}d ${h}h ${m}m ${s}s`;
}
setInterval(update,1000);update();

function openLetter(){
document.getElementById("popup").style.display="flex";
}
function closeLetter(){
document.getElementById("popup").style.display="none";
}

for(let i=0;i<45;i++){
let e=document.createElement("div");
e.className=Math.random()>0.5?"heart":"sparkle";
e.innerHTML=e.className=="heart"?"💖":"✨";
e.style.left=Math.random()*100+"vw";
e.style.fontSize=(16+Math.random()*20)+"px";
e.style.animationDuration=(4+Math.random()*5)+"s";
document.body.appendChild(e);
}
</script>

</body>
</html>
